name: Daily PNR Check

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pnr-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Run PNR notifier
        env:
          PNR_LIST_JSON: ${{ secrets.PNR_LIST_JSON }}
          EMT_HEADERS_JSON: ${{ secrets.EMT_HEADERS_JSON }}
          RAPIDAPI_KEYS_JSON: ${{ secrets.RAPIDAPI_KEYS_JSON }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          RESEND_TO_EMAIL: ${{ vars.RESEND_TO_EMAIL }}
          STATE_FILE: ${{ vars.STATE_FILE }}
        run: uv run python src/pnr_notifier.py

      - name: Commit updated state
        env:
          STATE_FILE: ${{ vars.STATE_FILE || 'state/pnr_state.json' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATE_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "chore: update PNR state [skip ci]"
            git push
          fi
